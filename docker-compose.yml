name: crocevia-odoo

services:
  db:
    image: postgres:16
    container_name: crocevia-odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD non impostata — copia .env.example in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    # Immagine custom derivata da `odoo:18.0` con weasyprint, pyhanko,
    # pyhanko-certvalidator e qpdf installati (vedi Dockerfile).
    # Servono ai moduli custom del Crocevia per generare/verificare i
    # documenti firmati del registro volontari.
    build: .
    image: crocevia-odoo:18.0
    container_name: crocevia-odoo
    depends_on:
      - db
    ports:
      # In dev locale ODOO_BIND default 0.0.0.0 (accessibile dal LAN).
      # In produzione VPS impostare ODOO_BIND=127.0.0.1 nel .env: la
      # porta resta raggiungibile solo da nginx sullo stesso host.
      - "${ODOO_BIND:-0.0.0.0}:${ODOO_PORT:-8069}:8069"
    environment:
      # L'entrypoint dell'immagine Odoo usa queste variabili per la
      # connessione al DB (non vanno ripetute in odoo.conf).
      HOST: db
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:?DB_PASSWORD non impostata — copia .env.example in .env}
    volumes:
      - odoo-data:/var/lib/odoo          # filestore (allegati, immagini)
      - ./config:/etc/odoo               # odoo.conf
      - ./addons:/mnt/extra-addons       # moduli custom del Crocevia
      # Log su file persistente (richiesto da fail2ban in produzione).
      # In odoo.conf decommentare `logfile = /var/log/odoo/odoo.log`.
      - ./logs:/var/log/odoo
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
