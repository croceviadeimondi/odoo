# /etc/nginx/sites-available/odoo.croceviadeimondi.org.conf
#
# Reverse proxy nginx per il gestionale Odoo del Crocevia dei Mondi APS.
# Presuppone:
#   - cert wildcard *.croceviadeimondi.org gia' attivo, esposto dallo
#     snippet condiviso /etc/nginx/snippets/croceviadeimondi-ssl.conf
#     (stesso usato dagli altri sottodomini: cms, calendario, ...);
#   - Odoo in container che ascolta su 127.0.0.1:8069 (ODOO_BIND in .env);
#   - proxy_mode = True in odoo.conf.
#
# Per attivarlo:
#   sudo cp deploy/nginx/odoo.croceviadeimondi.org.conf \
#     /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/odoo.croceviadeimondi.org.conf \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ───── Rate limit per /web/login (anti brute-force a livello edge) ─────
limit_req_zone $binary_remote_addr zone=odoo_login:10m rate=5r/m;

# ───── Upstream: container Odoo locale ─────
upstream odoo_backend {
    server 127.0.0.1:8069;
}

upstream odoo_websocket {
    server 127.0.0.1:8069;
}

# ───── HTTP → HTTPS ─────
server {
    listen 80;
    listen [::]:80;
    server_name odoo.croceviadeimondi.org;
    return 301 https://odoo.croceviadeimondi.org$request_uri;
}

# ───── HTTPS ─────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odoo.croceviadeimondi.org;

    # Cert wildcard + parametri TLS + HSTS (snippet condiviso del dominio).
    include /etc/nginx/snippets/croceviadeimondi-ssl.conf;

    # Security headers (HSTS arriva dallo snippet).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Log dedicati per il gestionale (utile a fail2ban).
    access_log /var/log/nginx/odoo.access.log;
    error_log  /var/log/nginx/odoo.error.log warn;

    # Permetti upload allegati grossi (PDF firmati del registro volontari, ecc.).
    client_max_body_size 50M;
    client_body_buffer_size 256k;

    # Buffer e timeout adatti a Odoo (i report PDF possono essere lunghi).
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
    send_timeout 720s;
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;

    # Compressione (Odoo serve molto JSON e JS).
    gzip on;
    gzip_min_length 1100;
    gzip_buffers 4 32k;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;
    gzip_vary on;

    # ───── WebSocket / longpolling (Odoo 18 usa /websocket) ─────
    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # ───── Rate limit sul login ─────
    location = /web/login {
        limit_req zone=odoo_login burst=10 nodelay;

        proxy_pass http://odoo_backend;
        proxy_redirect off;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # ───── Catch-all verso Odoo ─────
    location / {
        proxy_pass http://odoo_backend;
        proxy_redirect off;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # Cache aggressiva per gli asset statici.
    location ~* /web/static/ {
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 864000;
        proxy_pass http://odoo_backend;
    }
}
