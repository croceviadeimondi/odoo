# /etc/fail2ban/filter.d/odoo.conf
#
# Filtro fail2ban per i fallimenti di login Odoo 18.
# Il pattern matcha la riga prodotta da odoo.addons.base.models.res_users
# quando un login fallisce (password sbagliata, utente inesistente, ecc.).
#
# Presuppone che Odoo scriva su file (logfile = /var/log/odoo/odoo.log
# in odoo.conf) e che quel file sia accessibile a fail2ban sul VPS.
# Vedi deploy/jail.d/odoo.conf per il jail collegato.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^.* odoo\.addons\.base\.models\.res_users: Login failed for db:.* login:.* from <HOST>\s*$
            ^.* odoo\.http: .*Bad password.* from <HOST>\s*$

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S,%%f
