# /etc/fail2ban/jail.d/odoo.conf
#
# Jail fail2ban per il gestionale Odoo del Crocevia.
# Banna IP dopo 5 fallimenti di login in 10 minuti, per 1 ora.
#
# Per attivarlo:
#   sudo cp deploy/fail2ban/filter.d/odoo.conf  /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/jail.d/odoo.conf    /etc/fail2ban/jail.d/
#   sudo systemctl restart fail2ban
#   sudo fail2ban-client status odoo
#
# IMPORTANTE: Odoo deve loggare su file. In odoo.conf decommentare:
#   logfile = /var/log/odoo/odoo.log
# e montare il volume nel docker-compose:
#   - ./logs:/var/log/odoo

[odoo]
enabled  = true
port     = http,https
filter   = odoo
logpath  = /var/log/odoo/odoo.log
maxretry = 5
findtime = 600
bantime  = 3600
backend  = polling
